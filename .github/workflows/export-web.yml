name: Export Godot Web

on:
  push:
    branches:
      - main
    paths-ignore:
      - "index.html"
      - "index.js"
      - "index.pck"
      - "index.wasm"
      - "index.audio.position.worklet.js"
      - "index.audio.worklet.js"
      - "index.icon.png"
      - "index.apple-touch-icon.png"
  pull_request:
    paths-ignore:
      - "index.html"
      - "index.js"
      - "index.pck"
      - "index.wasm"
      - "index.audio.position.worklet.js"
      - "index.audio.worklet.js"
      - "index.icon.png"
      - "index.apple-touch-icon.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-web:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Provision local animal voice clips
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/preserve-original-polish'
        shell: bash
        run: |
          set -euo pipefail

          expected=(cachorro gato macaco baleia cavalo galinha tartaruga)
          complete=true
          for name in "${expected[@]}"; do
            if [ ! -s "audio/words/${name}.ogg" ]; then
              complete=false
              break
            fi
          done
          if [ "$complete" = true ]; then
            echo "Animal voice clips already exist."
            exit 0
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip espeak >/dev/null
          python3 -m pip install --quiet --break-system-packages gTTS

          mkdir -p audio/words /tmp/zoo-voices

          curl -fL --retry 3 -o /tmp/zoo-voices/gato.ogg \
            "https://raw.githubusercontent.com/RafaelTomazGraciano/ninoedu/main/assets/Vogal_O/AudiosPalavras/gato.ogg"
          curl -fL --retry 3 -o /tmp/zoo-voices/macaco.ogg \
            "https://raw.githubusercontent.com/RafaelTomazGraciano/ninoedu/main/assets/Vogal_O/AudiosPalavras/macaco.ogg"
          curl -fL --retry 3 -o /tmp/zoo-voices/cavalo.ogg \
            "https://raw.githubusercontent.com/RafaelTomazGraciano/ninoedu/main/assets/Vogal_O/AudiosPalavras/cavalo.ogg"

          python3 - <<'PY'
          from gtts import gTTS
          import subprocess

          words = {
              "cachorro": "cachorro",
              "baleia": "baleia",
              "galinha": "galinha",
              "tartaruga": "tartaruga",
          }

          for filename, text in words.items():
              target = f"/tmp/zoo-voices/{filename}.mp3"
              try:
                  gTTS(text=text, lang="pt-br", slow=False).save(target)
              except Exception:
                  wav = f"/tmp/zoo-voices/{filename}.wav"
                  subprocess.run(
                      ["espeak", "-v", "pt-br", "-s", "125", "-p", "48", "-a", "180", "-w", wav, text],
                      check=True,
                  )
          PY

          for name in "${expected[@]}"; do
            input="/tmp/zoo-voices/${name}.ogg"
            if [ ! -f "$input" ]; then
              input="/tmp/zoo-voices/${name}.mp3"
            fi
            if [ ! -f "$input" ]; then
              input="/tmp/zoo-voices/${name}.wav"
            fi
            ffmpeg -loglevel error -y -i "$input" \
              -af "highpass=f=80,lowpass=f=10000,loudnorm=I=-16:LRA=7:TP=-1.5" \
              -c:a libvorbis -q:a 5 "audio/words/${name}.ogg"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/words/*.ogg

          if git diff --cached --quiet; then
            echo "No new audio files to commit."
            exit 0
          fi

          git commit -m "audio: add local animal name clips"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Download Godot 4.6
        shell: bash
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.6-stable_linux.x86_64

      - name: Install Godot 4.6 export templates
        shell: bash
        run: |
          curl -L -o export_templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz"
          rm -rf export_templates_unpack
          mkdir -p export_templates_unpack
          unzip -q export_templates.tpz -d export_templates_unpack
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          cp -R export_templates_unpack/templates/. "$HOME/.local/share/godot/export_templates/4.6.stable/"

      - name: Import project resources
        shell: bash
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Export Web build
        shell: bash
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --export-release "Web" index.html

      - name: Commit updated Web export
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index.js index.pck index.wasm
          git add index.audio.position.worklet.js index.audio.worklet.js index.icon.png index.apple-touch-icon.png 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Web export is already up to date."
            exit 0
          fi

          git commit -m "Update Godot Web export [skip ci]"
          git push origin HEAD:main
