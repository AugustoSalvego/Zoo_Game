name: Export Godot Web

on:
  push:
    branches:
      - main
    paths-ignore:
      - "index.html"
      - "index.js"
      - "index.pck"
      - "index.wasm"
      - "index.audio.position.worklet.js"
      - "index.audio.worklet.js"
      - "index.icon.png"
      - "index.apple-touch-icon.png"
  pull_request:
    paths-ignore:
      - "index.html"
      - "index.js"
      - "index.pck"
      - "index.wasm"
      - "index.audio.position.worklet.js"
      - "index.audio.worklet.js"
      - "index.icon.png"
      - "index.apple-touch-icon.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-web:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Generate standardized local voice clips
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/preserve-original-polish'
        shell: bash
        run: |
          set -euo pipefail

          if [ -s "audio/voice/final_back_menu.ogg" ]; then
            echo "Standardized voice clips already exist."
            exit 0
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip espeak >/dev/null
          python3 -m pip install --quiet --break-system-packages gTTS

          rm -rf /tmp/zoo-voice-standard
          mkdir -p /tmp/zoo-voice-standard audio/words audio/voice

          python3 - <<'PY'
          from gtts import gTTS
          from pathlib import Path
          import subprocess

          root = Path('/tmp/zoo-voice-standard')
          phrases = {
              'words/cachorro': 'Cachorro.',
              'words/gato': 'Gato.',
              'words/macaco': 'Macaco.',
              'words/baleia': 'Baleia.',
              'words/cavalo': 'Cavalo.',
              'words/galinha': 'Galinha.',
              'words/tartaruga': 'Tartaruga.',
              'voice/tutorial_look_animal': 'Olhe o animal.',
              'voice/tutorial_word_missing': 'Uma parte da palavra está faltando.',
              'voice/tutorial_choose_ca': 'Escolha a sílaba cá.',
              'voice/instruction_choose_syllable': 'Escolha a sílaba que completa o nome.',
              'voice/final_congratulations': 'Parabéns! Você completou o Zoológico das Sílabas!',
              'voice/final_play_again': 'Jogar de novo.',
              'voice/final_back_menu': 'Voltar ao menu.',
          }

          for key, text in phrases.items():
              target = root / f'{key.replace("/", "__")}.mp3'
              try:
                  gTTS(text=text, lang='pt-br', slow=False).save(str(target))
              except Exception:
                  wav = target.with_suffix('.wav')
                  subprocess.run(
                      ['espeak', '-v', 'pt-br', '-s', '128', '-p', '48', '-a', '180', '-w', str(wav), text],
                      check=True,
                  )
          PY

          render_clip() {
            key="$1"
            target="$2"
            mp3="/tmp/zoo-voice-standard/${key}.mp3"
            wav="/tmp/zoo-voice-standard/${key}.wav"
            input="$mp3"
            if [ ! -f "$input" ]; then
              input="$wav"
            fi
            ffmpeg -loglevel error -y -i "$input" \
              -af "highpass=f=80,lowpass=f=10000,loudnorm=I=-16:LRA=7:TP=-1.5" \
              -c:a libvorbis -q:a 5 "$target"
          }

          for name in cachorro gato macaco baleia cavalo galinha tartaruga; do
            render_clip "words__${name}" "audio/words/${name}.ogg"
          done

          for name in tutorial_look_animal tutorial_word_missing tutorial_choose_ca instruction_choose_syllable final_congratulations final_play_again final_back_menu; do
            render_clip "voice__${name}" "audio/voice/${name}.ogg"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/words/*.ogg audio/voice/*.ogg

          if git diff --cached --quiet; then
            echo "Voice files are already up to date."
            exit 0
          fi

          git commit -m "audio: standardize game voice clips"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Download Godot 4.6
        shell: bash
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.6-stable_linux.x86_64

      - name: Install Godot 4.6 export templates
        shell: bash
        run: |
          curl -L -o export_templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz"
          rm -rf export_templates_unpack
          mkdir -p export_templates_unpack
          unzip -q export_templates.tpz -d export_templates_unpack
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          cp -R export_templates_unpack/templates/. "$HOME/.local/share/godot/export_templates/4.6.stable/"

      - name: Import project resources
        shell: bash
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Export Web build
        shell: bash
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --export-release "Web" index.html

      - name: Commit updated Web export
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index.js index.pck index.wasm
          git add index.audio.position.worklet.js index.audio.worklet.js index.icon.png index.apple-touch-icon.png 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Web export is already up to date."
            exit 0
          fi

          git commit -m "Update Godot Web export [skip ci]"
          git push origin HEAD:main
