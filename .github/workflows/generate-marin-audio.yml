name: Generate Free Kokoro Voice Pack

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-kokoro-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout audio branch
        uses: actions/checkout@v4
        with:
          ref: fix/preserve-original-polish
          fetch-depth: 0

      - name: Install free local TTS dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python3 -m pip install --upgrade pip
          python3 -m pip install "kokoro>=0.9.4" soundfile numpy

      - name: Generate complete Kokoro pt-BR voice pack
        shell: bash
        run: |
          python3 tools/generate_marin_audio.py --force
          python3 tools/generate_marin_audio.py --check

      - name: Commit generated voice assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add audio/marin/manifest.json audio/marin/*.mp3

          if git diff --cached --quiet; then
            echo "Kokoro voice pack is already up to date."
            exit 0
          fi

          git commit -m "audio: generate complete free Kokoro pt-BR voice pack"
          git push origin "HEAD:fix/preserve-original-polish"
