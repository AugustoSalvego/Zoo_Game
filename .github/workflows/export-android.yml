name: Export Godot Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scenes/**"
      - "scripts/**"
      - "img/**"
      - "project.godot"
      - "export_presets.cfg"
      - "icon.svg"
      - ".github/workflows/export-android.yml"

jobs:
  export-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Godot 4.6
        shell: bash
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.6-stable_linux.x86_64

      - name: Install Godot 4.6 export templates
        shell: bash
        run: |
          curl -L -o export_templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz"
          rm -rf export_templates_unpack
          mkdir -p export_templates_unpack
          unzip -q export_templates.tpz -d export_templates_unpack
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          cp -R export_templates_unpack/templates/. "$HOME/.local/share/godot/export_templates/4.6.stable/"

      - name: Configure Android SDK path for Godot
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/debug_keystore = ""
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project resources
        shell: bash
        run: |
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Export Android debug APK
        shell: bash
        run: |
          mkdir -p build/android
          ./Godot_v4.6-stable_linux.x86_64 --headless --path . --export-debug "Android" build/android/zoo-silabas-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoo-silabas-debug-apk
          path: build/android/zoo-silabas-debug.apk
          if-no-files-found: error
